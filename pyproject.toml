[project]
name = "meterial-symbols"
version = "1.3.0"
description = "Material Symbols compatible font for all your meter/progress needs!"
requires-python = ">=3.13"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "João Pereira", email = "me@toino.pt" }]
dependencies = [
    "dataclasses-json >= 0.6.7",
    "fonttools[woff] >= 4.59.1",
]

[project.optional-dependencies]
dev = [
    "pyright==1.1.414",
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meterial_symbols"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src"]
exclude = ["tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
# Not all dependencies have type hints:
reportMissingTypeStubs = false
# Already covered by ruff's flake8-self checks:
reportPrivateImportUsage = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
